[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bonehub-dataset-quality-check-server"
version = "0.3.0"
description = "Server that distributes BoneHub subjects to editors in 3D Slicer and reviewers in the browser, and writes confirmed segmentations back into the dataset."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Hamid Alavi"}
]

# Only the data schema is taken from BoneHub-Dataset, with its [io] extra (numpy and
# SimpleITK) for reading and writing .seg.nrrd segmentations; none of the conversion or
# segmentation stack is pulled in. The server is written for schema 0.3 and refuses to
# start with another (see config.WRITTEN_FOR_SCHEMA).
dependencies = [
    "bonehub-dataset[io] @ git+https://github.com/BoneHub/BoneHub-Dataset.git",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
    "numpy>=1.24",
    "SimpleITK>=2.2",
]

[project.optional-dependencies]
# The test suite is plain unittest (python -m unittest discover -s tests); httpx is what
# fastapi.testclient needs to drive the app in-process.
dev = [
    "httpx>=0.27",
]

[project.scripts]
bonehub-qc-server = "bonehub_quality_check_server.__main__:main"

[tool.setuptools.packages.find]
include = ["bonehub_quality_check_server*"]

# The admin panel and the review page are served from these files at run time, so they must
# be installed with the package; tests/test_review_page.py checks nothing under static/ is missed.
[tool.setuptools.package-data]
bonehub_quality_check_server = ["static/*.html", "static/*.js", "static/*.css", "static/vendor/*"]

