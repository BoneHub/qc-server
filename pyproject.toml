[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bonehub-dataset-quality-check-server"
version = "0.1.0"
description = "Server that distributes BoneHub subjects to 3D Slicer reviewers and writes confirmed segmentations back into the dataset."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Hamid Alavi"}
]

# Only the data schema is taken from BoneHub-Dataset: its base install is deliberately
# lean (pydantic alone), so none of the conversion or segmentation stack is pulled in.
dependencies = [
    "bonehub-dataset @ git+https://github.com/BoneHub/BoneHub-Dataset.git",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
    "nibabel>=5.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# The test suite is plain unittest (python -m unittest discover -s tests); httpx is what
# fastapi.testclient needs to drive the app in-process.
dev = [
    "httpx>=0.27",
]

[project.scripts]
bonehub-qc-server = "bonehub_quality_check_server.__main__:main"

[tool.setuptools.packages.find]
include = ["bonehub_quality_check_server*"]

[tool.setuptools.package-data]
bonehub_quality_check_server = ["static/*.html"]

