# Run the quality-check server against a BoneHub dataset folder, on a disk of this computer
# or on an SMB share.
#
#   1. copy .env.example to .env and say where the dataset is: BONEHUB_DATASET_PATH for a
#      folder on this computer, or BONEHUB_DATASET_SHARE and its credentials for a share
#   2. docker compose up -d --build
#   3. docker compose logs | grep -A2 "admin key"   # a new server prints its admin key once
#   4. open http://localhost:8000/admin
#
# A local folder is bind-mounted. A share is mounted through a CIFS volume rather than a
# bind mount because Docker Desktop cannot bind-mount a Windows mapped network drive: given
# "Z:/..." it silently creates an empty folder instead, and the server then starts against
# an empty dataset. Mounting the UNC path keeps Docker out of the drive-letter business
# entirely.
#
# Another server on this computer, on another dataset or on the same one, runs from a copy
# of this folder whose .env gives it a COMPOSE_PROJECT_NAME and a port of its own.

# The server's name on this computer. Compose names the container, the image and the volumes
# after it -- the credentials volume of this one is bonehub_qc_credentials -- so nothing
# below has a fixed name that a second server would share. COMPOSE_PROJECT_NAME in .env
# replaces it.
name: bonehub_qc

services:
  bonehub-qc-server:
    build: .
    ports:
      - "${BONEHUB_QC_PORT:-8000}:8000"
    volumes:
      # The dataset: the folder in BONEHUB_DATASET_PATH when that is filled in, the share of
      # the dataset volume below when it is blank. (Compose bind-mounts a path and mounts a
      # bare name as a volume.)
      # Mounted read-write: the server keeps its non-secret state -- the verdicts and the
      # corrected segmentations waiting for approval among it -- in .bonehub_qc/<server id>/,
      # and writes what the administrator approves into the segmentations, Subject_info
      # files and quality-check logs of the dataset.
      - "${BONEHUB_DATASET_PATH:-dataset}:/data"
      # The server's credentials -- its id, private key, admin key and user accounts --
      # stay here, on the Docker host, never with the dataset. This volume IS the server:
      # removing it (docker compose down -v) creates a new server on the next start, with a
      # new admin key, no users, and a new state folder in the dataset.
      - "credentials:/var/lib/bonehub-qc"
    environment:
      BONEHUB_QC_DATASET_ROOT: /data
      BONEHUB_QC_CREDENTIALS_DIR: /var/lib/bonehub-qc
      # Leave these blank to have the server generate them on first start and keep them
      # in the credentials volume. The generated admin key is printed once, at that start.
      BONEHUB_QC_ADMIN_KEY: "${BONEHUB_QC_ADMIN_KEY:-}"
      BONEHUB_QC_PRIVATE_KEY: "${BONEHUB_QC_PRIVATE_KEY:-}"
      # Queue policy. Anything in QCServerConfig can be set as BONEHUB_QC_<FIELD>. A value
      # set here wins over the admin panel at every start; blank leaves the setting to the
      # admin panel, starting from the server's default.
      # Blank means every dataset under the root; "none" resets a previously saved value.
      BONEHUB_QC_ALLOWED_DATASET_IDS: "${BONEHUB_QC_ALLOWED_DATASET_IDS:-}"
      # Label statuses that queue a subject: 1 = not reviewed yet (2 = already reviewed).
      BONEHUB_QC_ELIGIBLE_LABEL_VALUES: "${BONEHUB_QC_ELIGIBLE_LABEL_VALUES:-}"
      BONEHUB_QC_LEASE_TTL_SECONDS: "${BONEHUB_QC_LEASE_TTL_SECONDS:-}"
      BONEHUB_QC_MAX_CONCURRENT_ASSIGNMENTS_PER_USER: "${BONEHUB_QC_MAX_CONCURRENT_ASSIGNMENTS_PER_USER:-}"
      # Whether an editor's corrections go back to a reviewer.
      BONEHUB_QC_EDITS_NEED_REVIEW: "${BONEHUB_QC_EDITS_NEED_REVIEW:-}"
    restart: unless-stopped

volumes:
  # The SMB share. Used only when BONEHUB_DATASET_PATH is blank; Compose leaves the volume
  # out otherwise. A named volume, so the CIFS options below are applied by Docker's own
  # mount rather than by Windows. uid/gid 0 match the container, which runs as root.
  #
  # The substitutions check .env before anything starts: with neither BONEHUB_DATASET_PATH
  # nor BONEHUB_DATASET_SHARE filled in, the device stops Compose with a message (with a
  # path, the device takes it, but the volume is not used then), and a share is refused
  # without its username and password.
  #
  # IMPORTANT: the options are baked in when the volume is first created. After changing
  # the share or the SMB variables in .env, recreate it (<name>_dataset, after the server's
  # name above):
  #     docker compose down && docker volume rm bonehub_qc_dataset && docker compose up -d
  # Nothing is lost -- the volume holds no data of its own, only the mount to the share.
  dataset:
    driver: local
    driver_opts:
      type: cifs
      device: "${BONEHUB_DATASET_SHARE:-${BONEHUB_DATASET_PATH:?set BONEHUB_DATASET_PATH (a folder on this computer) or BONEHUB_DATASET_SHARE (an SMB share) in .env}}"
      o: "username=${BONEHUB_DATASET_SHARE:+${BONEHUB_SMB_USERNAME:?set BONEHUB_SMB_USERNAME in .env}},password=${BONEHUB_DATASET_SHARE:+${BONEHUB_SMB_PASSWORD:?set BONEHUB_SMB_PASSWORD in .env}},uid=0,gid=0,file_mode=0664,dir_mode=0775,${BONEHUB_SMB_OPTIONS:-vers=3.0}"

  # A plain local volume on the Docker host. Unlike the dataset volume above, it holds data:
  # the server's credentials. Keep it as long as the server should keep its admin key and
  # users. Named <name>_credentials, after the server's name above.
  credentials:
